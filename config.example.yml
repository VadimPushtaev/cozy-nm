mode: head
node_name: cozy-head
listen_port: 8000
database_url: postgresql+psycopg://cozy:cozy@postgres:5432/cozy_network_manager
polling_interval_seconds: 60
device_scan_interval_seconds: 10
stale_after_seconds: 300
host_root: /host
wireguard_interfaces: []
device_subnets:
  - 10.46.0.0/24
wireguard_clients_path: /host/wireguard/clients
# The deployment head also runs a minion, so this must differ from listen_port.
minion_port: 8001
public_ipv4_url: https://ifconfig.me/ip
head_auth_file: .cozy-nm/head-auth.json
head_auth_session_days: 30
head_auth_cookie_secure: false

# Optional named-node compatibility settings. New deployments should use deployment below.
known_nodes: []
minions: []
deployment:
  # Fill these with VPN addresses before running deploy.py.
  head:
  minions: []

dns:
  domains: []
  hostnames: []

bridges:
  hosts: []
