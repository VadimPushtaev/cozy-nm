<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cozy Network Manager</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Cozy Network Manager</a>
      <nav>
        <a href="/nodes">Devices</a>
        <a href="/dns">DNS</a>
        <a href="/forwards">Port forwards</a>
        <a href="/warnings">Warnings</a>
        {% if request.state.auth_configured and request.state.authenticated %}
          <a href="/auth/settings">Password</a>
          <form class="inline-form nav-form" method="post" action="/auth/logout">
            <button type="submit">Sign out</button>
          </form>
        {% elif not request.state.auth_configured %}
          <a href="/auth/setup">Set password</a>
        {% endif %}
      </nav>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
