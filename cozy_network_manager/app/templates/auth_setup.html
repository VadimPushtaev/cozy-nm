{% extends "base.html" %}
{% block content %}
  <section class="auth-card panel">
    <div class="page-head">
      <h1>Set a password</h1>
      <p>The dashboard is currently open to anyone who can reach it.</p>
    </div>
    {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/setup">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="{{ minimum_length }}" required autofocus autocomplete="new-password">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm_password" type="password" minlength="{{ minimum_length }}" required autocomplete="new-password">
      <button type="submit">Set password</button>
    </form>
  </section>
{% endblock %}
